<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineExpress - Catálogo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>🎬 CineExpress</h1>
        <nav>
            <a href="#catalogo">Catálogo</a>
            <a href="#agregar">Agregar Película</a>
            <a href="#nosotros">Nosotros</a>
        </nav>
    </header>

    <main>
        <aside id="nosotros">
            <h2>Géneros</h2>
            <!-- Extra: Filtro por Género -->
            <select id="filtro-genero">
                <option value="Todos">Todos los géneros</option>
                <option value="Acción">Acción</option>
                <option value="Comedia">Comedia</option>
                <option value="Terror">Terror</option>
                <option value="Drama">Drama</option>
                <option value="Ciencia Ficción">Ciencia Ficción</option>
            </select>

            <hr>
            <p><strong>CineExpress DVD</strong></p>
            <p>Tu videoclub de confianza. Alquiler de los mejores títulos en DVD.</p>
        </aside>

        <section id="catalogo">
            <h2>Catálogo de Películas</h2>
            
            <!-- Extra: Buscador por Título -->
            <div class="buscador-container">
                <input type="search" id="input-busqueda" placeholder="Buscar por título...">
            </div>

            <p id="estado-carga">Cargando películas...</p>
            <div id="grid-peliculas" class="grid-container"></div>
        </section>

        <section id="agregar">
            <h2>Agregar Nueva Película</h2>
            <form id="form-pelicula">
                <div>
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" required minlength="2">
                </div>
                <div>
                    <label for="duracion">Duración (minutos):</label>
                    <input type="number" id="duracion" required min="1">
                </div>
                <div>
                    <label for="copias">Copias Disponibles:</label>
                    <input type="number" id="copias" required min="0">
                </div>
                <div>
                    <label for="genero">Género:</label>
                    <select id="genero" required>
                        <option value="">Seleccione un género</option>
                        <option value="Acción">Acción</option>
                        <option value="Comedia">Comedia</option>
                        <option value="Terror">Terror</option>
                        <option value="Drama">Drama</option>
                        <option value="Ciencia Ficción">Ciencia Ficción</option>
                    </select>
                </div>
                <button type="submit">Guardar Película</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CineExpress. Contacto: contacto@cineexpress.com</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
